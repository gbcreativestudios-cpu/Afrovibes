backend:
  name: github
  repo: gbcreativestudios-cpu/Afrovibes
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    summary: "{{title}} — {{date}} ({{status}})"
    fields:
      - { label: "ID (used in the URL — lowercase-with-hyphens)", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Title Font Size (e.g. 3rem, 48px — leave blank for default)", name: "titleFontSize", widget: "string", required: false }
      - { label: "Title Color", name: "titleColor", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Leave blank to use the default theme color." }
      - label: "Event Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        hint: "Set the exact event day. Before today = Past; today or later = Upcoming. The earliest future date automatically becomes Next Event."
      - { label: "Time", name: "time", widget: "string", required: false, hint: "e.g. 7:00 PM" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Venue", name: "venue", widget: "string", required: false, hint: "Specific venue name or address, if different from Location." }
      - label: "Additional Details"
        name: "customFields"
        widget: "list"
        required: false
        hint: "Add any extra event details as your own label + text — e.g. \"Dress Code\" / \"Smart casual\"."
        label_singular: "Detail"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Content", name: "content", widget: "text" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["TICKETS AVAILABLE", "COMING SOON"]
        hint: "Only shown for upcoming events. \"Tickets Available\" shows the pink Get Ticket button (using the URL below) and the badge on the card; \"Coming Soon\" shows the outline badge with no ticket button."
      - { label: "Ticket URL", name: "url", widget: "string", required: false }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Short Description", name: "desc", widget: "text" }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Photos only. These automatically appear on the event page once the event's date has passed, and feed the past-events ticker."
        field: { label: "Image", name: "url", widget: "image" }
      - { label: "Show Video Section?", name: "showVideos", widget: "boolean", default: false, hint: "Turns the video section on/off once the event has passed. Leave off if you don't have a video yet." }
      - label: "Gallery Videos"
        name: "galleryVideos"
        widget: "list"
        required: false
        hint: "Video links only — keep these out of Gallery Images so the photo ticker doesn't pick them up."
        field: { label: "Video URL", name: "url", widget: "string" }
      - { label: "Instagram / Video Link", name: "instagram", widget: "string", required: false }

  - name: "products"
    label: "Merch"
    folder: "content/products"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    summary: "{{name}} — CAD ${{price}}"
    fields:
      - { label: "ID (used in the URL — lowercase-with-hyphens)", name: "id", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Price (CAD)", name: "price", widget: "number", value_type: "float" }
      - { label: "Product Image", name: "image", widget: "image" }
      - label: "Available Sizes"
        name: "sizes"
        widget: "list"
        field: { label: "Size", name: "size", widget: "string" }
      - label: "Available Colors"
        name: "colors"
        widget: "list"
        fields:
          - { label: "Color Name", name: "name", widget: "string" }
          - { label: "Hex Code", name: "hex", widget: "string" }
      - label: "Customization Options"
        name: "custom"
        widget: "list"
        field: { label: "Option", name: "option", widget: "string" }

  - name: "team"
    label: "Team"
    folder: "content/team"
    create: true
    delete: true
    extension: "json"
    format: "json"
    summary: "{{name}} — {{role}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }

  - name: "site"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Settings"
        file: "content/site.json"
        fields:
          - { label: "WhatsApp Number (digits only, with country code)", name: "whatsappNumber", widget: "string" }
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
          - { label: "TikTok URL", name: "tiktokUrl", widget: "string" }
          - { label: "Logo Image", name: "logoImage", widget: "image", required: false, hint: "Used in the nav bar, and in the footer too unless a separate Footer Logo is set below. Leave empty to keep the default AFROVIBES text logo." }
          - { label: "Footer Logo Image", name: "footerLogoImage", widget: "image", required: false, hint: "Optional — only needed if you want a different logo in the footer than the nav bar. Leave empty to reuse the Logo Image above." }
          - { label: "Footer Logo Height (px)", name: "footerLogoSize", widget: "number", value_type: "int", required: false, hint: "Leave blank for the default size." }
          - { label: "Favicon", name: "favicon", widget: "image", required: false, hint: "Small square image, shown in the browser tab. Leave empty to keep the default." }
          - { label: "Past-Events Ticker — Max Images", name: "galleryTickerLimit", widget: "number", value_type: "int", default: 10, hint: "Caps how many photos the moving ticker on the Events page pulls in total, no matter how many are in the galleries." }
          - label: "Homepage Hero Background"
            name: "heroBackground"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rotate through images?", name: "enabled", widget: "boolean", default: false, hint: "Off = solid black background (current look). On = crossfades through the images below." }
              - { label: "Seconds Between Images", name: "interval", widget: "number", value_type: "int", default: 4, min: 3, max: 5 }
              - label: "Images"
                name: "images"
                widget: "list"
                required: false
                hint: "Add up to 3 images to rotate through."
                field: { label: "Image", name: "url", widget: "image" }
          - label: "Hero Scroll-Down Arrow"
            name: "heroScrollIndicator"
            widget: "object"
            collapsed: true
            hint: "The small breathing down-arrow at the bottom of the hero banner, hinting there's more below."
            fields:
              - { label: "Show scroll arrow?", name: "enabled", widget: "boolean", default: true }
          - label: "Upcoming Events — \"View All Events\" Button"
            name: "upcomingEventsViewAll"
            widget: "object"
            collapsed: true
            hint: "The button next to the Upcoming Events title on the homepage that links to the full Events page. Hidden by default."
            fields:
              - { label: "Show this button?", name: "enabled", widget: "boolean", default: false }
          - label: "Newsletter Section (Text)"
            name: "newsletter"
            widget: "object"
            collapsed: true
            hint: "The paragraph shown under the Newsletter title (found at the bottom of multiple pages). The title itself is set under Page & Section Titles → Newsletter Section → Title."
            fields:
              - { label: "Paragraph", name: "paragraph", widget: "text", required: false }
          - label: "Our Partners (Homepage Logo Strip)"
            name: "partners"
            widget: "object"
            collapsed: true
            hint: "The scrolling strip of partner/sponsor logos below the hero. The section title is set under Page & Section Titles → Home Page → \"Our Partners\" Title."
            fields:
              - { label: "Show this section?", name: "enabled", widget: "boolean", default: true }
              - { label: "Section Background Color", name: "bgColor", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Colors the whole Partners section — the logos sit directly on it (no separate strip background or border). Leave blank to use the default dark background." }
              - label: "Partner Logos"
                name: "logos"
                widget: "list"
                required: false
                hint: "Add one image per partner. They scroll in an infinite loop, in the order listed here."
                field: { label: "Logo Image", name: "url", widget: "image" }
          - label: "Optional Info Section (Homepage)"
            name: "customSection"
            widget: "object"
            collapsed: true
            hint: "A fully optional section right after the Partners strip. Leave off if you don't need it. The title is set under Page & Section Titles → Home Page → \"Optional Info Section\" Title."
            fields:
              - { label: "Show this section?", name: "enabled", widget: "boolean", default: false }
              - { label: "Paragraph", name: "paragraph", widget: "text", required: false }
          - label: "\"Next Event\" Section Background"
            name: "nextEventBg"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Color", name: "color", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Leave blank for the default purple." }
          - label: "Buttons (Nav Bar + Hero)"
            name: "buttonSlots"
            widget: "object"
            collapsed: true
            hint: "Each spot below is a button on the site. Pick which of the 3 destinations it points to, an optional custom label, and whether it shows at all. The destinations themselves never change — only what fills each spot."
            fields:
              - label: "Nav Bar Button"
                name: "navCta"
                widget: "object"
                fields: &button_slot_fields
                  - { label: "Show this button?", name: "enabled", widget: "boolean", default: true }
                  - label: "Which destination?"
                    name: "action"
                    widget: "select"
                    default: "tickets"
                    options:
                      - { label: "Get Tickets", value: "tickets" }
                      - { label: "Explore Events", value: "events" }
                      - { label: "Shop Merch", value: "merch" }
                  - { label: "Custom label (optional)", name: "label", widget: "string", required: false, hint: "Leave blank to use the destination's default text (e.g. \"Get Tickets\")." }
              - label: "Hero Button 1 (left/first)"
                name: "heroPrimary"
                widget: "object"
                fields: *button_slot_fields
              - label: "Hero Button 2 (right/second)"
                name: "heroSecondary"
                widget: "object"
                fields: *button_slot_fields
          - label: "Social Links (Footer)"
            name: "socialLinks"
            widget: "list"
            required: false
            hint: "Shown as icon buttons in the footer. Add, remove, or reorder as needed."
            fields:
              - label: "Platform"
                name: "platform"
                widget: "select"
                options:
                  - { label: "Facebook", value: "facebook" }
                  - { label: "Instagram", value: "instagram" }
                  - { label: "TikTok", value: "tiktok" }
                  - { label: "WhatsApp", value: "whatsapp" }
                  - { label: "X / Twitter", value: "x" }
                  - { label: "YouTube", value: "youtube" }
                  - { label: "Threads", value: "threads" }
                  - { label: "Snapchat", value: "snapchat" }
                  - { label: "Email", value: "email" }
                  - { label: "Other / Link", value: "other" }
              - { label: "URL (or mailto:/wa.me link)", name: "url", widget: "string" }
          - label: "Who We Are — Top Banner"
            name: "aboutBanner"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show banner?", name: "enabled", widget: "boolean", default: false }
              - { label: "Banner Image", name: "image", widget: "image", required: false }
              - { label: "Banner Text", name: "text", widget: "string", required: false }
              - label: "Banner Size"
                name: "size"
                widget: "select"
                required: false
                default: "compact"
                hint: "Compact is the current default height. Landscape is a taller, more cinematic banner."
                options:
                  - { label: "Compact (default)", value: "compact" }
                  - { label: "Landscape (taller)", value: "landscape" }
          - label: "Who We Are — Feature Images"
            name: "aboutFeatures"
            widget: "object"
            collapsed: true
            hint: "The photo shown next to each of the 3 purple headings on the Who We Are page (Great People / Bring People Together / Redefine Connection). Leave blank to keep the current placeholder."
            fields:
              - { label: "\"Great People. Great Experiences.\" Image", name: "greatPeopleImage", widget: "image", required: false }
              - { label: "\"Bring People Together.\" Image", name: "bringPeopleImage", widget: "image", required: false }
              - { label: "\"Redefine Connection.\" Image", name: "redefineImage", widget: "image", required: false }
          - label: "Event Thumbnail Controls"
            name: "eventThumbnails"
            widget: "object"
            collapsed: true
            hint: "Choose the aspect ratio for each event thumbnail. Adapt preserves the uploaded image ratio; fixed ratios crop the image to the selected frame. Past Event controls are independent for the Events page and Home page."
            fields:
              - label: "Next Event Thumbnail"
                name: "next"
                widget: "select"
                default: "adapt"
                options:
                  - { label: "Adapt to image", value: "adapt" }
                  - { label: "1:1", value: "1:1" }
                  - { label: "4:5", value: "4:5" }
                  - { label: "3:4", value: "3:4" }
                  - { label: "2:3", value: "2:3" }
                  - { label: "3:2", value: "3:2" }
                  - { label: "4:3", value: "4:3" }
                  - { label: "16:9", value: "16:9" }
                  - { label: "21:9", value: "21:9" }
              - label: "Upcoming Event Thumbnails"
                name: "upcoming"
                widget: "select"
                default: "adapt"
                options:
                  - { label: "Adapt to image", value: "adapt" }
                  - { label: "1:1", value: "1:1" }
                  - { label: "4:5", value: "4:5" }
                  - { label: "3:4", value: "3:4" }
                  - { label: "2:3", value: "2:3" }
                  - { label: "3:2", value: "3:2" }
                  - { label: "4:3", value: "4:3" }
                  - { label: "16:9", value: "16:9" }
                  - { label: "21:9", value: "21:9" }
              - label: "Past Events — Events Page"
                name: "pastEvents"
                widget: "select"
                default: "adapt"
                options:
                  - { label: "Adapt to image", value: "adapt" }
                  - { label: "1:1", value: "1:1" }
                  - { label: "4:5", value: "4:5" }
                  - { label: "3:4", value: "3:4" }
                  - { label: "2:3", value: "2:3" }
                  - { label: "3:2", value: "3:2" }
                  - { label: "4:3", value: "4:3" }
                  - { label: "16:9", value: "16:9" }
                  - { label: "21:9", value: "21:9" }
              - label: "Past Events — Home Page"
                name: "pastHome"
                widget: "select"
                default: "adapt"
                options:
                  - { label: "Adapt to image", value: "adapt" }
                  - { label: "1:1", value: "1:1" }
                  - { label: "4:5", value: "4:5" }
                  - { label: "3:4", value: "3:4" }
                  - { label: "2:3", value: "2:3" }
                  - { label: "3:2", value: "3:2" }
                  - { label: "4:3", value: "4:3" }
                  - { label: "16:9", value: "16:9" }
                  - { label: "21:9", value: "21:9" }
          - label: "Global Typography"
            name: "typographyScale"
            widget: "object"
            collapsed: true
            hint: "One control panel for text sitewide, grouped by role. Adjusting Weight, Size, Line Height or Letter Spacing here changes every matching element at once. Color is the one exception: individual items (like a specific title) can still have their own color set elsewhere in Decap, but if you set a Color here, it overrides every individual color in this category. Leave a category Color blank and nothing changes. Size is a single desktop reference number -- mobile scales down automatically and proportionally."
            fields:
              - label: "Home Page Hero"
                name: "hero-home"
                widget: "object"
                collapsed: true
                hint: "The big title at the very top of the Home page only."
                fields:
                  - label: "Weight"
                    name: "weight"
                    widget: "select"
                    required: false
                    default: "900"
                    options:
                    - { label: "Light (300)", value: "300" }
                    - { label: "Regular (400)", value: "400" }
                    - { label: "Medium (500)", value: "500" }
                    - { label: "Demi / Semi Bold (600)", value: "600" }
                    - { label: "Bold (700)", value: "700" }
                    - { label: "Extra Bold (800)", value: "800" }
                    - { label: "Black / Heavy (900)", value: "900" }
                  - label: "Size (px, desktop reference -- scales down automatically on mobile)"
                    name: "size"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 104
                  - label: "Line Height"
                    name: "lineHeight"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 0.9
                  - label: "Letter Spacing (em -- negative tightens, positive spreads out)"
                    name: "letterSpacing"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: -0.06
                  - label: "Color (overrides individual colors in this category when set)"
                    name: "color"
                    widget: "color"
                    required: false
                    allowInput: true
                    enableAlpha: false
              - label: "Other Page Heroes"
                name: "hero-page"
                widget: "object"
                collapsed: true
                hint: "The big banner title at the top of every other page -- Who We Are, Events, Merch, Connect, individual Event pages, and Product pages."
                fields:
                  - label: "Weight"
                    name: "weight"
                    widget: "select"
                    required: false
                    default: "900"
                    options:
                    - { label: "Light (300)", value: "300" }
                    - { label: "Regular (400)", value: "400" }
                    - { label: "Medium (500)", value: "500" }
                    - { label: "Demi / Semi Bold (600)", value: "600" }
                    - { label: "Bold (700)", value: "700" }
                    - { label: "Extra Bold (800)", value: "800" }
                    - { label: "Black / Heavy (900)", value: "900" }
                  - label: "Size (px, desktop reference -- scales down automatically on mobile)"
                    name: "size"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 96
                  - label: "Line Height"
                    name: "lineHeight"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 0.9
                  - label: "Letter Spacing (em -- negative tightens, positive spreads out)"
                    name: "letterSpacing"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: -0.06
                  - label: "Color (overrides individual colors in this category when set)"
                    name: "color"
                    widget: "color"
                    required: false
                    allowInput: true
                    enableAlpha: false
              - label: "Headlines (Section Titles)"
                name: "headline"
                widget: "object"
                collapsed: true
                hint: "Every section title sitewide -- Next Event, Our Partners, About page section titles, Newsletter, and more."
                fields:
                  - label: "Weight"
                    name: "weight"
                    widget: "select"
                    required: false
                    default: "900"
                    options:
                    - { label: "Light (300)", value: "300" }
                    - { label: "Regular (400)", value: "400" }
                    - { label: "Medium (500)", value: "500" }
                    - { label: "Demi / Semi Bold (600)", value: "600" }
                    - { label: "Bold (700)", value: "700" }
                    - { label: "Extra Bold (800)", value: "800" }
                    - { label: "Black / Heavy (900)", value: "900" }
                  - label: "Size (px, desktop reference -- scales down automatically on mobile)"
                    name: "size"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 72
                  - label: "Line Height"
                    name: "lineHeight"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 0.9
                  - label: "Letter Spacing (em -- negative tightens, positive spreads out)"
                    name: "letterSpacing"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: -0.055
                  - label: "Color (overrides individual colors in this category when set)"
                    name: "color"
                    widget: "color"
                    required: false
                    allowInput: true
                    enableAlpha: false
              - label: "Subheadings (Event Titles on Cards)"
                name: "subheading"
                widget: "object"
                collapsed: true
                hint: "The event name shown on event cards, the Next Event card, and Past Events -- not the big title on an event's own page (that's a Page Hero, above)."
                fields:
                  - label: "Weight"
                    name: "weight"
                    widget: "select"
                    required: false
                    default: "900"
                    options:
                    - { label: "Light (300)", value: "300" }
                    - { label: "Regular (400)", value: "400" }
                    - { label: "Medium (500)", value: "500" }
                    - { label: "Demi / Semi Bold (600)", value: "600" }
                    - { label: "Bold (700)", value: "700" }
                    - { label: "Extra Bold (800)", value: "800" }
                    - { label: "Black / Heavy (900)", value: "900" }
                  - label: "Size (px, desktop reference -- scales down automatically on mobile)"
                    name: "size"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 24
                  - label: "Line Height"
                    name: "lineHeight"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 1.1
                  - label: "Letter Spacing (em -- negative tightens, positive spreads out)"
                    name: "letterSpacing"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: -0.03
                  - label: "Color (overrides individual colors in this category when set)"
                    name: "color"
                    widget: "color"
                    required: false
                    allowInput: true
                    enableAlpha: false
              - label: "Body Copy"
                name: "body"
                widget: "object"
                collapsed: true
                hint: "Every paragraph, sitewide."
                fields:
                  - label: "Weight"
                    name: "weight"
                    widget: "select"
                    required: false
                    default: "600"
                    options:
                    - { label: "Light (300)", value: "300" }
                    - { label: "Regular (400)", value: "400" }
                    - { label: "Medium (500)", value: "500" }
                    - { label: "Demi / Semi Bold (600)", value: "600" }
                    - { label: "Bold (700)", value: "700" }
                    - { label: "Extra Bold (800)", value: "800" }
                    - { label: "Black / Heavy (900)", value: "900" }
                  - label: "Size (px, desktop reference -- scales down automatically on mobile)"
                    name: "size"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 17.6
                  - label: "Line Height"
                    name: "lineHeight"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 1.5
                  - label: "Letter Spacing (em -- negative tightens, positive spreads out)"
                    name: "letterSpacing"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 0
                  - label: "Color (overrides individual colors in this category when set)"
                    name: "color"
                    widget: "color"
                    required: false
                    allowInput: true
                    enableAlpha: false
              - label: "Captions"
                name: "caption"
                widget: "object"
                collapsed: true
                hint: "Small text tied to a photo -- team member names, merch product names, and the labels on the Home page merch cards."
                fields:
                  - label: "Weight"
                    name: "weight"
                    widget: "select"
                    required: false
                    default: "700"
                    options:
                    - { label: "Light (300)", value: "300" }
                    - { label: "Regular (400)", value: "400" }
                    - { label: "Medium (500)", value: "500" }
                    - { label: "Demi / Semi Bold (600)", value: "600" }
                    - { label: "Bold (700)", value: "700" }
                    - { label: "Extra Bold (800)", value: "800" }
                    - { label: "Black / Heavy (900)", value: "900" }
                  - label: "Size (px, desktop reference -- scales down automatically on mobile)"
                    name: "size"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 20
                  - label: "Line Height"
                    name: "lineHeight"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: 1.2
                  - label: "Letter Spacing (em -- negative tightens, positive spreads out)"
                    name: "letterSpacing"
                    widget: "number"
                    required: false
                    value_type: "float"
                    default: -0.01
                  - label: "Color (overrides individual colors in this category when set)"
                    name: "color"
                    widget: "color"
                    required: false
