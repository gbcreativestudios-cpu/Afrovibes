backend:
  name: github
  repo: gbcreativestudios-cpu/Afrovibes
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: "events"
    label: "Events"
    folder: "content/events"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    summary: "{{title}} — {{date}} ({{status}})"
    fields:
      - { label: "ID (used in the URL — lowercase-with-hyphens)", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Title Font Size (e.g. 3rem, 48px — leave blank for default)", name: "titleFontSize", widget: "string", required: false }
      - { label: "Title Color", name: "titleColor", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Leave blank to use the default theme color." }
      - { label: "Event Date", name: "date", widget: "date", format: "YYYY-MM-DD", hint: "Whether this shows as upcoming or past is now automatic — the site compares this date to today, no need to set that yourself." }
      - { label: "Time", name: "time", widget: "string", required: false, hint: "e.g. 7:00 PM" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Venue", name: "venue", widget: "string", required: false, hint: "Specific venue name or address, if different from Location." }
      - label: "Additional Details"
        name: "customFields"
        widget: "list"
        required: false
        hint: "Add any extra event details as your own label + text — e.g. \"Dress Code\" / \"Smart casual\"."
        label_singular: "Detail"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Content", name: "content", widget: "text" }
      - label: "Status"
        name: "status"
        widget: "select"
        options: ["TICKETS AVAILABLE", "COMING SOON"]
        hint: "Only shown for upcoming events. \"Tickets Available\" shows the pink Get Ticket button (using the URL below) and the badge on the card; \"Coming Soon\" shows the outline badge with no ticket button."
      - { label: "Ticket URL", name: "url", widget: "string", required: false }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Short Description", name: "desc", widget: "text" }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        hint: "Photos only. These automatically appear on the event page once the event's date has passed, and feed the past-events ticker."
        field: { label: "Image", name: "url", widget: "image" }
      - { label: "Show Video Section?", name: "showVideos", widget: "boolean", default: false, hint: "Turns the video section on/off once the event has passed. Leave off if you don't have a video yet." }
      - label: "Gallery Videos"
        name: "galleryVideos"
        widget: "list"
        required: false
        hint: "Video links only — keep these out of Gallery Images so the photo ticker doesn't pick them up."
        field: { label: "Video URL", name: "url", widget: "string" }
      - { label: "Instagram / Video Link", name: "instagram", widget: "string", required: false }

  - name: "products"
    label: "Merch"
    folder: "content/products"
    create: true
    delete: true
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    summary: "{{name}} — CAD ${{price}}"
    fields:
      - { label: "ID (used in the URL — lowercase-with-hyphens)", name: "id", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Price (CAD)", name: "price", widget: "number", value_type: "float" }
      - { label: "Product Image", name: "image", widget: "image" }
      - label: "Available Sizes"
        name: "sizes"
        widget: "list"
        field: { label: "Size", name: "size", widget: "string" }
      - label: "Available Colors"
        name: "colors"
        widget: "list"
        fields:
          - { label: "Color Name", name: "name", widget: "string" }
          - { label: "Hex Code", name: "hex", widget: "string" }
      - label: "Customization Options"
        name: "custom"
        widget: "list"
        field: { label: "Option", name: "option", widget: "string" }

  - name: "team"
    label: "Team"
    folder: "content/team"
    create: true
    delete: true
    extension: "json"
    format: "json"
    summary: "{{name}} — {{role}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Role", name: "role", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Display Order", name: "order", widget: "number", value_type: "int", default: 1 }

  - name: "site"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "General Settings"
        file: "content/site.json"
        fields:
          - { label: "WhatsApp Number (digits only, with country code)", name: "whatsappNumber", widget: "string" }
          - { label: "Contact Email", name: "contactEmail", widget: "string" }
          - { label: "Instagram URL", name: "instagramUrl", widget: "string" }
          - { label: "TikTok URL", name: "tiktokUrl", widget: "string" }
          - { label: "Logo Image", name: "logoImage", widget: "image", required: false, hint: "Used in the nav bar, and in the footer too unless a separate Footer Logo is set below. Leave empty to keep the default AFROVIBES text logo." }
          - { label: "Footer Logo Image", name: "footerLogoImage", widget: "image", required: false, hint: "Optional — only needed if you want a different logo in the footer than the nav bar. Leave empty to reuse the Logo Image above." }
          - { label: "Footer Logo Height (px)", name: "footerLogoSize", widget: "number", value_type: "int", required: false, hint: "Leave blank for the default size." }
          - { label: "Favicon", name: "favicon", widget: "image", required: false, hint: "Small square image, shown in the browser tab. Leave empty to keep the default." }
          - { label: "Past-Events Ticker — Max Images", name: "galleryTickerLimit", widget: "number", value_type: "int", default: 10, hint: "Caps how many photos the moving ticker on the Events page pulls in total, no matter how many are in the galleries." }
          - label: "Homepage Hero Background"
            name: "heroBackground"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Rotate through images?", name: "enabled", widget: "boolean", default: false, hint: "Off = solid black background (current look). On = crossfades through the images below." }
              - { label: "Seconds Between Images", name: "interval", widget: "number", value_type: "int", default: 4, min: 3, max: 5 }
              - label: "Images"
                name: "images"
                widget: "list"
                required: false
                hint: "Add up to 3 images to rotate through."
                field: { label: "Image", name: "url", widget: "image" }
          - label: "Homepage Scrolling Ticker"
            name: "heroTicker"
            widget: "object"
            collapsed: true
            hint: "The scrolling marquee text right below the hero banner."
            fields:
              - { label: "Show this ticker?", name: "enabled", widget: "boolean", default: true }
              - label: "Words"
                name: "words"
                widget: "list"
                hint: "Each word/phrase shown in the loop, in order."
                field: { label: "Word", name: "text", widget: "string" }
          - label: "\"Next Event\" Section Background"
            name: "nextEventBg"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Background Color", name: "color", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Leave blank for the default purple." }
          - label: "Who We Are — Top Banner"
            name: "aboutBanner"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Show banner?", name: "enabled", widget: "boolean", default: false }
              - { label: "Banner Image", name: "image", widget: "image", required: false }
              - { label: "Banner Text", name: "text", widget: "string", required: false }
          - label: "Text Weights & Styles"
            name: "typography"
            widget: "object"
            collapsed: true
            hint: "Each control below only affects its own section — changing one never changes the others."
            fields:
              - label: "Footer Text Weight"
                name: "footerWeight"
                widget: "select"
                required: false
                hint: "Affects every line of text inside the footer (links, tagline, copyright) at once. Leave blank for the default look."
                options:
                  - { label: "Default", value: "" }
                  - { label: "Light", value: "300" }
                  - { label: "Regular", value: "400" }
                  - { label: "Medium", value: "500" }
                  - { label: "Demi / Semi Bold", value: "600" }
                  - { label: "Bold", value: "700" }
                  - { label: "Heavy", value: "800" }
              - label: "\"Who We Are\" Body Text Weight"
                name: "aboutBodyWeight"
                widget: "select"
                required: false
                hint: "Affects the paragraph text on the Who We Are page only (the intro, and the text under Great People / Bring People Together / Redefine Connection)."
                options:
                  - { label: "Default", value: "" }
                  - { label: "Light", value: "300" }
                  - { label: "Regular", value: "400" }
                  - { label: "Medium", value: "500" }
                  - { label: "Demi / Semi Bold", value: "600" }
                  - { label: "Bold", value: "700" }
                  - { label: "Heavy", value: "800" }
              - label: "\"Connection / Adventure / Community / Memories\" Weight"
                name: "valuesHeadingWeight"
                widget: "select"
                required: false
                hint: "One control for all 4 words at once."
                options:
                  - { label: "Default", value: "" }
                  - { label: "Light", value: "300" }
                  - { label: "Regular", value: "400" }
                  - { label: "Medium", value: "500" }
                  - { label: "Demi / Semi Bold", value: "600" }
                  - { label: "Bold", value: "700" }
                  - { label: "Heavy", value: "800" }
              - label: "\"Connection / Adventure / Community / Memories\" Color"
                name: "valuesHeadingColor"
                widget: "color"
                required: false
                allowInput: true
                enableAlpha: false
                hint: "One control for all 4 words at once. Leave blank for the default white."
              - label: "\"Connection / Adventure / Community / Memories\" Size"
                name: "valuesHeadingSize"
                widget: "string"
                required: false
                hint: "One control for all 4 words at once, e.g. 1.3rem or 22px. Leave blank for the default size."

      - name: "titles"
        label: "Page & Section Titles"
        file: "content/titles.json"
        fields:
          - label: "Home Page"
            name: "home"
            widget: "object"
            collapsed: true
            fields:
              - name: "heroTitle"
                label: "Hero Title"
                widget: "object"
                fields: &title_fields
                  - { label: "Text", name: "text", widget: "string", hint: "Type it exactly how you want it to appear — any casing." }
                  - { label: "Font Size (e.g. 3rem, 48px — leave blank for default)", name: "fontSize", widget: "string", required: false }
                  - { label: "Color", name: "color", widget: "color", required: false, allowInput: true, enableAlpha: false, hint: "Leave blank to use the default theme color." }
              - name: "nextEventTitle"
                label: "\"Next Event\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "upcomingEventTitle"
                label: "\"Upcoming Event\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "pastVibesTitle"
                label: "\"Past Vibes\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "statementTitle"
                label: "\"Best Memories Are Shared\" Statement"
                widget: "object"
                fields: *title_fields
              - name: "merchTeaserTitle"
                label: "\"Wear The Vibe\" Merch Teaser Title"
                widget: "object"
                fields: *title_fields
          - label: "Who We Are Page"
            name: "about"
            widget: "object"
            collapsed: true
            fields:
              - name: "heroTitle"
                label: "Hero Title"
                widget: "object"
                fields: *title_fields
              - name: "greatPeopleTitle"
                label: "\"Great People\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "bringPeopleTitle"
                label: "\"Bring People Together\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "redefineTitle"
                label: "\"Redefine Connection\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "teamTitle"
                label: "\"Meet The Team\" Section Title"
                widget: "object"
                fields: *title_fields
          - label: "Events Page"
            name: "events"
            widget: "object"
            collapsed: true
            fields:
              - name: "nextEventTitle"
                label: "\"Next Event\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "calendarTitle"
                label: "\"Our Calendar\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "pastEventsTitle"
                label: "\"Past Events\" Section Title"
                widget: "object"
                fields: *title_fields
          - label: "Merch Page"
            name: "merch"
            widget: "object"
            collapsed: true
            fields:
              - name: "heroTitle"
                label: "Hero Title"
                widget: "object"
                fields: *title_fields
          - label: "Connect Page"
            name: "connect"
            widget: "object"
            collapsed: true
            fields:
              - name: "heroTitle"
                label: "Hero Title"
                widget: "object"
                fields: *title_fields
              - name: "createTitle"
                label: "\"Let's Create Something\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "messageTitle"
                label: "\"Send Us A Message\" Section Title"
                widget: "object"
                fields: *title_fields
          - label: "Event Detail Pages"
            name: "eventDetail"
            widget: "object"
            collapsed: true
            hint: "Shown on every individual event's page."
            fields:
              - name: "momentsTitle"
                label: "\"The Moments\" Section Title"
                widget: "object"
                fields: *title_fields
              - name: "videosTitle"
                label: "\"The Videos\" Section Title"
                widget: "object"
                fields: *title_fields
          - label: "Newsletter Section"
            name: "newsletter"
            widget: "object"
            collapsed: true
            hint: "Shown at the bottom of multiple pages."
            fields:
              - name: "title"
                label: "Title"
                widget: "object"
                fields: *title_fields
          - label: "404 Page"
            name: "notFound"
            widget: "object"
            collapsed: true
            fields:
              - name: "title"
                label: "Title"
                widget: "object"
                fields: *title_fields
