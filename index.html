<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D0D0D" />
    <title>Afrovibes — Experiences Worth Showing Up For</title>
    <meta
      name="description"
      content="Afrovibes creates unforgettable social experiences that bring people together."
    />
  </head>
  <body class="bg-black text-offwhite">
    <div id="root"></div>
    <!-- Static twin of the "Send Us A Message" form on /connect. Netlify's
         build bot only scans plain HTML for forms (it can't see forms
         rendered later by React), so this hidden copy is what lets Netlify
         detect the form and create the "contact" inbox in the dashboard.
         Field names here must stay in sync with the real form in
         src/pages/Connect.jsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="c-name" />
      <input type="email" name="c-email" />
      <input type="text" name="c-brand" />
      <select name="c-type">
        <option value="Partnership">Partnership</option>
        <option value="Brand Activation">Brand Activation</option>
        <option value="Event Collaboration">Event Collaboration</option>
        <option value="Sponsorship">Sponsorship</option>
        <option value="Community Engagement">Community Engagement</option>
        <option value="Creative Collaboration">Creative Collaboration</option>
        <option value="Other">Other</option>
      </select>
      <textarea name="c-message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        // Netlify Identity's invite/recovery/confirmation email links land
        // on the site with a hash like #invite_token=... or
        // #recovery_token=..., and the widget authenticates you as part of
        // processing that token — before this code even runs. Only THAT
        // case should bounce straight to /admin. Without this check, any
        // ordinary visit to the site (including deploy preview links)
        // would also redirect to /admin just because a login session
        // happened to persist from before, which hijacks normal browsing.
        var authTokenInUrl = /(confirmation_token|invite_token|recovery_token|email_change_token)=/.test(
          window.location.hash
        );

        window.netlifyIdentity.on("init", (user) => {
          if (user && authTokenInUrl) {
            if (!window.location.pathname.startsWith("/admin")) {
              document.location.href = "/admin/";
            }
          } else if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
